# Mosquitto-Konfiguration HausBroker -> /etc/mosquitto/conf.d/hausbroker.conf
# Nur im Heimnetz: Port 1883 ohne TLS (die Arduinos mit Ethernet-Shield koennen kein TLS),
# dafuer Benutzer mit Passwort. Port 1883 im Router NICHT nach aussen freigeben.

# per_listener_settings ist aus: Login, Passwortdatei und ACL gelten fuer beide Listener.
listener 1883
allow_anonymous false

# WebSocket fuer den Browser (z. B. MQTTX Web): ws://hausbroker.local:9001
# Ebenfalls nur im Heimnetz, im Router NICHT freigeben.
listener 9001
protocol websockets
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/hausbroker.acl

# Retained Messages (letzter Wert je Topic) ueberstehen einen Neustart.
# SD-Karte schonen: nur alle 30 min auf die Karte schreiben, statt bei jeder Aenderung.
persistence true
autosave_interval 1800
